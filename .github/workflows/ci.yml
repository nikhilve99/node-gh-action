name: NodeJS CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
